version: '3.9'

services:

  # ── Infrastructure ────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       moneyswift
      POSTGRES_USER:     ms_user
      POSTGRES_PASSWORD: ms_secret
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ms_user -d moneyswift"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  gateway:
    build: ../../apps/gateway
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - account-service
      - wallet-service
      - transaction-service
      - payment-service
      - card-service
      - notification-service

  # ── Microservices ────────────────────────────
  auth-service:
    build: ../../services/auth-service
    environment:
      PORT:                 3001
      DATABASE_URL:         postgresql://ms_user:ms_secret@postgres:5432/moneyswift
      REDIS_URL:            redis://redis:6379
      JWT_SECRET:           ${JWT_SECRET}
      JWT_REFRESH_SECRET:   ${JWT_REFRESH_SECRET}
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  account-service:
    build: ../../services/account-service
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://ms_user:ms_secret@postgres:5432/moneyswift
      REDIS_URL:    redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }

  wallet-service:
    build: ../../services/wallet-service
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://ms_user:ms_secret@postgres:5432/moneyswift
      REDIS_URL:    redis://redis:6379

  transaction-service:
    build: ../../services/transaction-service
    environment:
      PORT:                   3004
      DATABASE_URL:           postgresql://ms_user:ms_secret@postgres:5432/moneyswift
      REDIS_URL:              redis://redis:6379
      MTN_MOMO_BASE_URL:      ${MTN_MOMO_BASE_URL}
      MTN_MOMO_API_KEY:       ${MTN_MOMO_API_KEY}
      ORANGE_MONEY_CLIENT_ID: ${ORANGE_MONEY_CLIENT_ID}
      ORANGE_MONEY_SECRET:    ${ORANGE_MONEY_SECRET}
    depends_on:
      postgres: { condition: service_healthy }

  payment-service:
    build: ../../services/payment-service
    environment:
      PORT:                   3005
      DATABASE_URL:           postgresql://ms_user:ms_secret@postgres:5432/moneyswift
      ANGARA_PAY_URL:         ${ANGARA_PAY_URL}
      ANGARA_PAY_API_KEY:     ${ANGARA_PAY_API_KEY}
      ANGARA_PAY_MERCHANT_ID: ${ANGARA_PAY_MERCHANT_ID}
      ANGARA_PAY_WEBHOOK_SECRET: ${ANGARA_PAY_WEBHOOK_SECRET}

  card-service:
    build: ../../services/card-service
    environment:
      PORT:            3006
      DATABASE_URL:    postgresql://ms_user:ms_secret@postgres:5432/moneyswift
      ENCRYPTION_KEY:  ${ENCRYPTION_KEY}

  notification-service:
    build: ../../services/notification-service
    environment:
      PORT:              3007
      DATABASE_URL:      postgresql://ms_user:ms_secret@postgres:5432/moneyswift
      REDIS_URL:         redis://redis:6379
      FCM_SERVER_KEY:    ${FCM_SERVER_KEY}
      SMS_API_KEY:       ${SMS_API_KEY}

volumes:
  pg_data:
  redis_data:
