events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log format
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;

    # Upstreams
    upstream auth_service        { server auth-service:3001; }
    upstream account_service     { server account-service:3002; }
    upstream wallet_service      { server wallet-service:3003; }
    upstream transaction_service { server transaction-service:3004; }
    # upstream payment_service     { server payment-service:3005; }
    upstream card_service        { server card-service:3006; }
    # upstream notification_service { server notification-service:3007; }

    # Rate limiting zones (Must be in http block)
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    server {
        listen 80;
        server_name api.moneyswift.cm localhost _;

        # Sécurité headers
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=63072000";

        # Rate limiting global
        limit_req zone=api burst=20 nodelay;

        # ── Routage par préfixe ──────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        location /api/v1/accounts/     { proxy_pass http://account_service; }
        location /api/v1/wallets/      { proxy_pass http://wallet_service; }
        location /api/v1/transactions/ { proxy_pass http://transaction_service; }
        # location /api/v1/payments/     { proxy_pass http://payment_service; }
        location /api/v1/cards/        { proxy_pass http://card_service; }
        # location /api/v1/notifications/ { proxy_pass http://notification_service; }

        # Health checks
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
    }
}
