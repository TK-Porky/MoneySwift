events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # Utilisation d'un resolver public (IPv6 off pour éviter les 502 sur Render)
    resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Indispensable pour le proxying vers des URLs HTTPS (SNI)
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # Sécurité headers
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=63072000";

        # Rate limiting global
        limit_req zone=api burst=20 nodelay;

        # ── Racine & Health ──────────────────────────────
        
        location / {
            return 301 /health;
        }

        location /health {
            access_log off;
            return 200 '{"status":"ok", "message":"MoneySwift API Gateway is live"}';
            add_header Content-Type application/json;
        }

        # ── Documentation (Swagger) ──────────────────────
        
        rewrite ^/api-docs$ /api-docs/ permanent;

        location /api-docs/ {
            set $auth_docs "https://auth-service-2ino.onrender.com";
            proxy_pass $auth_docs$request_uri;
            proxy_set_header Host auth-service-2ino.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Buffers plus larges pour les définitions Swagger volumineuses
            proxy_buffer_size          128k;
            proxy_buffers              4 256k;
            proxy_busy_buffers_size    256k;

            # SNI explicite pour éviter les erreurs de certificat
            proxy_ssl_name auth-service-2ino.onrender.com;
            proxy_ssl_server_name on;
        }

        # ── Microservices (Routage via URLs publiques) ────────────
        
        location /api/v1/auth/ {
            set $auth_url "https://auth-service-2ino.onrender.com";
            limit_req zone=auth burst=5 nodelay;
            proxy_pass $auth_url$request_uri;
            proxy_set_header Host auth-service-2ino.onrender.com;
            proxy_set_header X-Forwarded-Proto https;

            proxy_ssl_name auth-service-2ino.onrender.com;
            proxy_ssl_server_name on;
        }

        location /api/v1/accounts/ {
            set $account_url "https://account-service-0xyk.onrender.com";
            proxy_pass $account_url$request_uri;
            proxy_set_header Host account-service-0xyk.onrender.com;
            proxy_set_header X-Forwarded-Proto https;

            proxy_ssl_name account-service-0xyk.onrender.com;
            proxy_ssl_server_name on;
        }

        location /api/v1/wallets/ {
            set $wallet_url "https://wallet-service-m7rp.onrender.com";
            proxy_pass $wallet_url$request_uri;
            proxy_set_header Host wallet-service-m7rp.onrender.com;
            proxy_set_header X-Forwarded-Proto https;

            proxy_ssl_name wallet-service-m7rp.onrender.com;
            proxy_ssl_server_name on;
        }

        location /api/v1/transactions/ {
            set $transaction_url "https://transaction-service-ua6o.onrender.com";
            proxy_pass $transaction_url$request_uri;
            proxy_set_header Host transaction-service-ua6o.onrender.com;
            proxy_set_header X-Forwarded-Proto https;

            proxy_ssl_name transaction-service-ua6o.onrender.com;
            proxy_ssl_server_name on;
        }

        location /api/v1/cards/ {
            set $card_url "https://card-service-j11h.onrender.com";
            proxy_pass $card_url$request_uri;
            proxy_set_header Host card-service-j11h.onrender.com;
            proxy_set_header X-Forwarded-Proto https;

            proxy_ssl_name card-service-j11h.onrender.com;
            proxy_ssl_server_name on;
        }
    }
}
