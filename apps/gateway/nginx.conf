events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # Sur Render, on n'utilise pas le resolver Docker 127.0.0.11
    # Le DNS système de Render gère la résolution interne.

    server {
        listen 80;
        server_name _; # Accepte les requêtes de l'URL Render de la gateway

        # Sécurité headers
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=63072000";

        # Rate limiting global
        limit_req zone=api burst=20 nodelay;

        # ── Racine & Health ──────────────────────────────
        
        location / {
            return 301 /health;
        }

        location /health {
            access_log off;
            return 200 '{"status":"ok", "message":"MoneySwift API Gateway is live"}';
            add_header Content-Type application/json;
        }

        # ── Documentation (Swagger) ──────────────────────
        
        # Redirige /api-docs vers /api-docs/ pour que les assets chargent bien
        rewrite ^/api-docs$ /api-docs/ permanent;

        location /api-docs/ {
            proxy_pass http://auth-service:3001/api-docs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Microservices (Routage interne) ────────────
        
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://auth-service:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/accounts/ {
            proxy_pass http://account-service:3002;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/wallets/ {
            proxy_pass http://wallet-service:3003;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/transactions/ {
            proxy_pass http://transaction-service:3004;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/cards/ {
            proxy_pass http://card-service:3006;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
