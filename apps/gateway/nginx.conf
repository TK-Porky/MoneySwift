events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # Le placeholder RESOLVER_IP sera remplacé au démarrage par le Dockerfile
    resolver RESOLVER_IP valid=30s;

    server {
        listen 80;
        server_name _;

        # Sécurité headers
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=63072000";

        # Rate limiting global
        limit_req zone=api burst=20 nodelay;

        # ── Racine & Health ──────────────────────────────
        
        location / {
            return 301 /health;
        }

        location /health {
            access_log off;
            return 200 '{"status":"ok", "message":"MoneySwift API Gateway is live"}';
            add_header Content-Type application/json;
        }

        # ── Documentation (Swagger) ──────────────────────
        
        rewrite ^/api-docs$ /api-docs/ permanent;

        location /api-docs/ {
            set $auth_backend "http://auth-service:3001";
            proxy_pass $auth_backend/api-docs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Microservices (Routage via variables) ────────────
        
        location /api/v1/auth/ {
            set $auth_url "http://auth-service:3001";
            limit_req zone=auth burst=5 nodelay;
            proxy_pass $auth_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/accounts/ {
            set $account_url "http://account-service:3002";
            proxy_pass $account_url;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/wallets/ {
            set $wallet_url "http://wallet-service:3003";
            proxy_pass $wallet_url;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/transactions/ {
            set $transaction_url "http://transaction-service:3004";
            proxy_pass $transaction_url;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/cards/ {
            set $card_url "http://card-service:3006";
            proxy_pass $card_url;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
