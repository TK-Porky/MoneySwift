events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # Resolver pour Render (DNS interne)
    # 127.0.0.11 est l'adresse standard du résolveur Docker/Render
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name api.moneyswift.cm localhost _;

        # Sécurité headers
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=63072000";

        # Rate limiting global
        limit_req zone=api burst=20 nodelay;

        # ── Routage dynamique (évite le crash au démarrage) ─────
        
        location /api/v1/auth/ {
            set $auth_backend "http://auth-service:3001";
            limit_req zone=auth burst=5 nodelay;
            proxy_pass $auth_backend;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        location /api/v1/accounts/ {
            set $account_backend "http://account-service:3002";
            proxy_pass $account_backend;
        }

        location /api/v1/wallets/ {
            set $wallet_backend "http://wallet-service:3003";
            proxy_pass $wallet_backend;
        }

        location /api/v1/transactions/ {
            set $transaction_backend "http://transaction-service:3004";
            proxy_pass $transaction_backend;
        }

        location /api/v1/cards/ {
            set $card_backend "http://card-service:3006";
            proxy_pass $card_backend;
        }

        # Health checks
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
    }
}
