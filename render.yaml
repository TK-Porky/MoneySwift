databases:
  - name: moneyswift-db
    databaseName: moneyswift
    user: ms_user
    plan: free

services:
  # ── Redis pour le bus d'événements ────────────────────────
  - type: redis
    name: moneyswift-redis
    plan: free
    ipAllowList: [] # Accès interne uniquement

  # ── Microservice : Auth ──────────────────────────────────
  - type: web
    name: auth-service
    plan: free
    env: docker
    dockerContext: .
    dockerfilePath: services/auth-service/Dockerfile
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: moneyswift-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: moneyswift-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # ── Microservice : Account ────────────────────────────────
  - type: web
    name: account-service
    plan: free
    env: docker
    dockerContext: .
    dockerfilePath: services/account-service/Dockerfile
    envVars:
      - key: PORT
        value: 3002
      - key: DATABASE_URL
        fromDatabase:
          name: moneyswift-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: moneyswift-redis
          property: connectionString

  # ── Microservice : Wallet ─────────────────────────────────
  - type: web
    name: wallet-service
    plan: free
    env: docker
    dockerContext: .
    dockerfilePath: services/wallet-service/Dockerfile
    envVars:
      - key: PORT
        value: 3003
      - key: DATABASE_URL
        fromDatabase:
          name: moneyswift-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: moneyswift-redis
          property: connectionString

  # ── Microservice : Transaction ────────────────────────────
  - type: web
    name: transaction-service
    plan: free
    env: docker
    dockerContext: .
    dockerfilePath: services/transaction-service/Dockerfile
    envVars:
      - key: PORT
        value: 3004
      - key: DATABASE_URL
        fromDatabase:
          name: moneyswift-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: moneyswift-redis
          property: connectionString

  # ── Microservice : Card ───────────────────────────────────
  - type: web
    name: card-service
    plan: free
    env: docker
    dockerContext: .
    dockerfilePath: services/card-service/Dockerfile
    envVars:
      - key: PORT
        value: 3006
      - key: DATABASE_URL
        fromDatabase:
          name: moneyswift-db
          property: connectionString
      - key: ENCRYPTION_KEY
        generateValue: true

  # ── Gateway Nginx ─────────────────────────────────────────
  - type: web
    name: api-gateway
    env: docker
    dockerContext: apps/gateway
    dockerfilePath: apps/gateway/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 80
